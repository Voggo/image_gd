[package]
name = "entro_gd"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = "1.0.1"
csv = "1.4.0"
chrono = "0.4.43"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-appender = "0.2.3"
once_cell = "1.21.3"
fxhash = "0.2.1"
image = { version = "0.25.6", default-features = true }

[dev-dependencies]
criterion = "0.8.2"
pretty_assertions = "1.4.1"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "benchmark_individual"
harness = false
