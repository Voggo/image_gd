[package]
name = "entro_gd"
version = "0.1.0"
edition = "2024"

[features]
default = []
experiment-runner = ["dep:serde", "dep:serde_json"]

[dependencies]
bitvec = "1.0.1"
csv = "1.4.0"
chrono = "0.4.44"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.4"
once_cell = "1.21.4"
fxhash = "0.2.1"
image = { version = "0.25.10", default-features = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[dev-dependencies]
criterion = "0.8.2"
pretty_assertions = "1.4.1"
png = "0.18.1"

[profile.release]
lto = "fat"

[profile.bench]
lto = "fat"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "benchmark_individual"
harness = false

[[example]]
name = "run_folder_experiments"
required-features = ["experiment-runner"]
